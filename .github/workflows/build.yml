name: Build & publish plugins

on:
  push:
    branches: [main]
    paths:
      - 'plugins/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable + wasm32 target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-tools
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-tools

      - name: Cache Rust (plugin workspaces)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: plugins/homeassistant

      - name: Build WASM plugins
        run: |
          mkdir -p dist
          for dir in plugins/*/; do
            [ -f "$dir/Cargo.toml" ] || continue
            id=$(basename "$dir")
            lib="${id//-/_}"
            echo "=== Building $id ==="
            cargo build --manifest-path "$dir/Cargo.toml" \
              --target wasm32-unknown-unknown --release
            wasm-tools component new \
              "$dir/target/wasm32-unknown-unknown/release/${lib}.wasm" \
              -o "$dir/plugin.wasm"
            tar -czf "dist/${id}.tar.gz" -C "$dir" \
              manifest.toml tools.json skill.md plugin.wasm
            echo "Built dist/${id}.tar.gz ($(wc -c < "dist/${id}.tar.gz") bytes)"
          done

      - name: Publish to rolling release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create plugins-latest \
            --prerelease \
            --title "Plugin packages — latest build" \
            --notes "Automatically built from the latest commit on \`main\`. Not for production use." \
            2>/dev/null || true
          gh release upload plugins-latest dist/*.tar.gz --clobber

      - name: Update registry with new SHA-256 hashes
        run: |
          for f in dist/*.tar.gz; do
            id=$(basename "$f" .tar.gz)
            sha=$(sha256sum "$f" | cut -d' ' -f1)
            size=$(wc -c < "$f")
            url="https://github.com/${{ github.repository }}/releases/download/plugins-latest/${id}.tar.gz"
            jq --arg id "$id" \
               --arg sha "$sha" \
               --arg url "$url" \
               --argjson size "$size" \
              'if (.plugins | map(.id) | index($id)) != null
               then (.plugins[] | select(.id == $id)) |= . + {"package": {"url": $url, "sha256": $sha, "size": $size}}
               else . end' \
              registry/plugins.json > /tmp/r.json && mv /tmp/r.json registry/plugins.json
            echo "Updated registry for $id: $sha"
          done

      - name: Commit updated registry
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add registry/plugins.json
          git diff --staged --quiet && { echo "Registry unchanged, skipping commit"; exit 0; }
          git commit -m "chore: update plugin registry [skip ci]"
          git push
