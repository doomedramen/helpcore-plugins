name: Build & publish plugins

on:
  push:
    branches: [main]
    paths:
      - 'plugins/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable + wasm32 target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-tools
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-tools

      - name: Cache Rust (plugin workspaces)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: plugins/homeassistant

      - name: Build WASM plugins
        run: |
          mkdir -p dist
          for dir in plugins/*/; do
            [ -f "$dir/Cargo.toml" ] || continue
            id=$(basename "$dir")
            lib="${id//-/_}"
            echo "=== Building $id ==="
            cargo build --manifest-path "$dir/Cargo.toml" \
              --target wasm32-unknown-unknown --release
            wasm-tools component new \
              "$dir/target/wasm32-unknown-unknown/release/${lib}.wasm" \
              -o "$dir/plugin.wasm"
            tar -czf "dist/${id}.tar.gz" -C "$dir" \
              manifest.toml tools.json skill.md plugin.wasm
            echo "Built dist/${id}.tar.gz ($(wc -c < "dist/${id}.tar.gz") bytes)"
          done

      - name: Publish to rolling release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create plugins-latest \
            --prerelease \
            --title "Plugin packages — latest build" \
            --notes "Automatically built from the latest commit on \`main\`. Not for production use." \
            2>/dev/null || true
          gh release upload plugins-latest dist/*.tar.gz --clobber

      - name: Generate registry from manifests
        run: |
          cat > /tmp/gen-registry.py << 'PYEOF'
          import json, os, tomllib, hashlib, sys

          plugins = []

          for entry in sorted(os.listdir("plugins")):
              manifest_path = f"plugins/{entry}/manifest.toml"
              if not os.path.isfile(manifest_path):
                  continue
              with open(manifest_path, "rb") as f:
                  m = tomllib.load(f)

              plugin = {
                  "id": m["id"],
                  "name": m["name"],
                  "description": m["description"],
                  "version": m["version"],
                  "tier": m["tier"],
                  "author": "Martin Page",
                  "homepage": "https://github.com/doomedramen/helpcore",
                  "permissions": m.get("permissions", []),
                  "source": {
                      "type": "github",
                      "repo": "doomedramen/helpcore-plugins",
                      "ref": "plugins-latest",
                  },
              }

              # Attach package info from built artifacts
              pkg_path = f"dist/{m['id']}.tar.gz"
              if os.path.isfile(pkg_path):
                  sha = hashlib.sha256(open(pkg_path, "rb").read()).hexdigest()
                  size = os.path.getsize(pkg_path)
                  pkg_url = f"https://github.com/doomedramen/helpcore-plugins/releases/download/plugins-latest/{m['id']}.tar.gz"
                  plugin["package"] = {"url": pkg_url, "sha256": sha, "size": size}

              plugins.append(plugin)

          with open("registry/plugins.json", "w") as f:
              json.dump({"plugins": plugins}, f, indent=2)
              f.write("\n")

          print(f"Generated registry with {len(plugins)} plugins")
          PYEOF
          python3 /tmp/gen-registry.py

      - name: Commit updated registry
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add registry/plugins.json
          git diff --staged --quiet && { echo "Registry unchanged, skipping commit"; exit 0; }
          git commit -m "chore: update plugin registry [skip ci]"
          git push
