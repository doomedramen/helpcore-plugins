id = "page-fetch"
name = "Page Fetch"
version = "0.1.4"
description = "Fetch any web page and read it as clean plain text — strips HTML, scripts and styling so agents can read articles, docs and pages directly"
tier = "wasm"
permissions = ["outbound_http"]
allowed_hosts = ["*"]

brief = "Use when the user shares a URL and asks to summarize, extract information from, or answer questions about a web page content."
