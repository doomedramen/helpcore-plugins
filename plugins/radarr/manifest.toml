id = "radarr"
name = "Radarr"
version = "0.1.1"
description = "Manage your Radarr movie download queue — search, add movies, and check download status"
tier = "wasm"
permissions = ["outbound_http"]
allowed_hosts = ["*"]

[[config_schema]]
key = "url"
label = "Radarr URL"
type = "url"
required = true
hint = "e.g. http://192.168.1.100:7878"

[[config_schema]]
key = "api_key"
label = "API Key"
type = "secret"
required = true
hint = "Find in Radarr → Settings → General → API Key"
