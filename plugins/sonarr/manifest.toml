id = "sonarr"
name = "Sonarr"
version = "0.1.4"
description = "Manage your Sonarr TV show download queue — search, add series, and check download status"
tier = "wasm"
permissions = ["outbound_http", "read_secrets"]
allowed_hosts = ["*"]

brief = "Use when the user asks to search for, add, or manage TV shows in their Sonarr download server."

[[config_schema]]
key = "url"
label = "Sonarr URL"
type = "url"
required = true
hint = "e.g. http://192.168.1.100:8989"

[[config_schema]]
key = "api_key"
label = "API Key"
type = "secret"
required = true
hint = "Find in Sonarr → Settings → General → API Key"
