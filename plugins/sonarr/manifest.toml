id = "sonarr"
name = "Sonarr"
version = "0.1.2"
description = "Manage your Sonarr TV show download queue — search, add series, and check download status"
tier = "wasm"
permissions = ["outbound_http"]
allowed_hosts = ["*"]

[[config_schema]]
key = "url"
label = "Sonarr URL"
type = "url"
required = true
hint = "e.g. http://192.168.1.100:8989"

[[config_schema]]
key = "api_key"
label = "API Key"
type = "secret"
required = true
hint = "Find in Sonarr → Settings → General → API Key"
