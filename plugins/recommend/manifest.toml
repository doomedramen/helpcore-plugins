id = "recommend"
name = "Recommend"
version = "0.1.4"
description = "Get recommendations for music, movies, TV shows, books, games, and more based on things you like — powered by TasteDive"
tier = "wasm"
permissions = ["outbound_http", "read_secrets"]
allowed_hosts = [
    "tastedive.com",
]

brief = "Use when the user asks for content recommendations — similar music artists, movies, TV shows, books, authors, games, or podcasts."

[[config_schema]]
key = "api_key"
label = "TasteDive API Key"
type = "secret"
required = false
hint = "Optional — get a free key at https://tastedive.com/read/api for higher rate limits"
