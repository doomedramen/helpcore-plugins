id = "proxmox"
name = "Proxmox Insights"
version = "0.1.4"
description = "Monitor Proxmox VE hosts, VMs, and LXC containers — CPU, memory, storage, hardware, and cluster health"
tier = "wasm"
permissions = ["outbound_http"]
allowed_hosts = ["*"]

[[config_schema]]
key = "host"
label = "Proxmox Host URL"
type = "url"
required = true
hint = "e.g. https://proxmox.local:8006"

[[config_schema]]
key = "token_id"
label = "API Token ID (preferred)"
type = "secret"
required = false
hint = "Format: user@realm!token_name, e.g. root@pam!monitoring. Use with token_secret."

[[config_schema]]
key = "token_secret"
label = "API Token Secret"
type = "secret"
required = false
hint = "The secret/UUID shown when creating the API token. Use with token_id."

[[config_schema]]
key = "username"
label = "Username (alternative to API token)"
type = "text"
required = false
hint = "Proxmox user including realm, e.g. root@pam"

[[config_schema]]
key = "password"
label = "Password"
type = "secret"
required = false
hint = "Proxmox user password"
