id = "movies-tv"
name = "Movies & TV"
version = "0.1.4"
description = "Search for movies and TV shows — get ratings, cast, plot summaries, and streaming info — powered by TMDB"
tier = "wasm"
permissions = ["outbound_http", "read_secrets"]
allowed_hosts = [
    "api.themoviedb.org",
    "image.tmdb.org",
]

brief = "Use when the user asks about movies or TV shows — searching for titles, getting ratings, cast, plot summaries, or season details."

[[config_schema]]
key = "api_key"
label = "TMDB API Key"
type = "secret"
required = true
hint = "Get a free API key at https://www.themoviedb.org/settings/api"
