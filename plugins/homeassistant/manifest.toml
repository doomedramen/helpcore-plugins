id = "homeassistant"
name = "Home Assistant"
version = "0.3.7"
description = "Control and monitor your Home Assistant smart home devices"
tier = "wasm"
permissions = ["outbound_http", "read_secrets"]
allowed_hosts = ["*"]

brief = "Use when the user asks to control smart home devices — lights, thermostats, locks, covers, fans, or to trigger automations, scenes, or scripts."

[[config_schema]]
key = "url"
label = "Home Assistant URL"
type = "url"
required = true
hint = "e.g. http://homeassistant.local:8123"

[[config_schema]]
key = "token"
label = "Long-Lived Access Token"
type = "secret"
required = true
hint = "Create one in your HA profile under Security → Long-lived access tokens"
