id = "plex"
name = "Plex"
version = "0.1.4"
description = "Browse and control your Plex media server — search libraries, see recently added, and check what's playing"
tier = "wasm"
permissions = ["outbound_http", "read_secrets"]
allowed_hosts = ["*"]

brief = "Use when the user asks about their Plex media server — searching for movies, shows, or music, recently added, currently playing, or library contents."

[[config_schema]]
key = "url"
label = "Plex Server URL"
type = "url"
required = true
hint = "e.g. http://192.168.1.100:32400"

[[config_schema]]
key = "token"
label = "X-Plex-Token"
type = "secret"
required = true
hint = "Find in Plex Web → Settings → Account → or inspect a media URL for X-Plex-Token"
