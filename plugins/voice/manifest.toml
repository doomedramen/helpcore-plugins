id = "voice"
name = "Voice"
version = "0.2.4"
description = "Convert speech to text and text to speech — connect any STT/TTS service to add voice input and output"
tier = "wasm"
permissions = ["outbound_http", "read_secrets"]
provides = ["audio"]
allowed_hosts = ["*"]

brief = "Use when the user provides an audio file or URL to transcribe, or asks for a spoken text-to-speech response to be generated."

[[config_schema]]
key = "stt_url"
label = "STT API URL"
type = "url"
required = false
hint = "Base URL for speech-to-text (Google Cloud STT, Deepgram, etc.)"

[[config_schema]]
key = "stt_api_key"
label = "STT API Key"
type = "secret"
required = false
hint = "API key for your speech-to-text provider"

[[config_schema]]
key = "stt_model"
label = "STT Model"
type = "string"
required = false
hint = "Model name (default: whisper-1)"

[[config_schema]]
key = "tts_url"
label = "TTS API URL"
type = "url"
required = false
hint = "Base URL for text-to-speech (Google Cloud TTS, OpenAI-compatible, etc.)"

[[config_schema]]
key = "tts_api_key"
label = "TTS API Key"
type = "secret"
required = false
hint = "API key for your text-to-speech provider"

[[config_schema]]
key = "tts_model"
label = "TTS Model"
type = "string"
required = false
hint = "Model name (default: tts-1)"

[[config_schema]]
key = "tts_voice"
label = "TTS Voice"
type = "string"
required = false
hint = "Default voice (default: alloy)"
