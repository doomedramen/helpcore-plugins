[workspace]

[package]
name = "voice-bridge"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "voice-bridge"
path = "src/main.rs"

[dependencies]
axum        = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "query", "macros"] }
tokio       = { version = "1", features = ["full"] }
reqwest     = { version = "0.12", default-features = false, features = ["rustls-tls", "multipart", "json", "stream"] }
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
bytes       = "1"
urlencoding = "2"
anyhow      = "1"
tracing               = "0.1"
tracing-subscriber    = { version = "0.3", features = ["env-filter"] }

[profile.release]
opt-level = 3
strip = true
